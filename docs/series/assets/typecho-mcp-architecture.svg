<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Typecho MCP Workbench architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf7f1"/>
      <stop offset="100%" stop-color="#d7e9e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#18332d" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="82" fill="#12312b" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700">Typecho MCP Workbench</text>
  <text x="72" y="122" fill="#47665d" font-family="Arial, sans-serif" font-size="18">Local-first publishing flow for humans and AI agents</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="250" height="130" rx="12" fill="#ffffff" stroke="#bed2c8"/>
    <text x="100" y="238" fill="#0f766e" font-family="Arial, sans-serif" font-size="17" font-weight="700">Human Workbench</text>
    <text x="100" y="273" fill="#213a35" font-family="Arial, sans-serif" font-size="25" font-weight="700">Markdown review</text>
    <text x="100" y="301" fill="#61756f" font-family="Arial, sans-serif" font-size="15">edit, preview, approve</text>

    <rect x="70" y="400" width="250" height="130" rx="12" fill="#ffffff" stroke="#bed2c8"/>
    <text x="100" y="448" fill="#0f766e" font-family="Arial, sans-serif" font-size="17" font-weight="700">AI Agent</text>
    <text x="100" y="483" fill="#213a35" font-family="Arial, sans-serif" font-size="25" font-weight="700">MCP tools</text>
    <text x="100" y="511" fill="#61756f" font-family="Arial, sans-serif" font-size="15">draft, update, publish</text>

    <rect x="430" y="295" width="260" height="130" rx="12" fill="#0f766e" stroke="#0f5f59"/>
    <text x="460" y="343" fill="#d9fff7" font-family="Arial, sans-serif" font-size="17" font-weight="700">Local Service</text>
    <text x="460" y="378" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">policy + audit</text>
    <text x="460" y="406" fill="#d7efea" font-family="Arial, sans-serif" font-size="15">snapshots, assets, SSH</text>

    <rect x="800" y="295" width="190" height="130" rx="12" fill="#ffffff" stroke="#bed2c8"/>
    <text x="830" y="343" fill="#0f766e" font-family="Arial, sans-serif" font-size="17" font-weight="700">SSH</text>
    <text x="830" y="378" fill="#213a35" font-family="Arial, sans-serif" font-size="25" font-weight="700">zero-touch</text>
    <text x="830" y="406" fill="#61756f" font-family="Arial, sans-serif" font-size="15">no public API</text>

    <rect x="1080" y="190" width="150" height="130" rx="12" fill="#ffffff" stroke="#bed2c8"/>
    <text x="1105" y="238" fill="#0f766e" font-family="Arial, sans-serif" font-size="17" font-weight="700">PHP Agent</text>
    <text x="1105" y="273" fill="#213a35" font-family="Arial, sans-serif" font-size="23" font-weight="700">ephemeral</text>
    <text x="1105" y="301" fill="#61756f" font-family="Arial, sans-serif" font-size="15">stdin/stdout</text>

    <rect x="1080" y="400" width="150" height="130" rx="12" fill="#ffffff" stroke="#bed2c8"/>
    <text x="1105" y="448" fill="#0f766e" font-family="Arial, sans-serif" font-size="17" font-weight="700">Typecho</text>
    <text x="1105" y="483" fill="#213a35" font-family="Arial, sans-serif" font-size="23" font-weight="700">blog data</text>
    <text x="1105" y="511" fill="#61756f" font-family="Arial, sans-serif" font-size="15">posts, media, DB</text>
  </g>

  <g stroke="#0f766e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 255 C365 255 380 330 430 340"/>
    <path d="M320 465 C365 465 380 390 430 380"/>
    <path d="M690 360 H800"/>
    <path d="M990 360 C1035 360 1035 260 1080 255"/>
    <path d="M990 360 C1035 360 1035 465 1080 465"/>
  </g>
  <g fill="#0f766e">
    <path d="M424 337 l-14 -8 v16z"/>
    <path d="M424 383 l-14 -8 v16z"/>
    <path d="M794 360 l-14 -8 v16z"/>
    <path d="M1074 257 l-14 -8 v16z"/>
    <path d="M1074 464 l-14 -8 v16z"/>
  </g>

  <rect x="70" y="610" width="1140" height="46" rx="8" fill="#ffffff" opacity="0.72" stroke="#bed2c8"/>
  <text x="92" y="640" fill="#28443d" font-family="Arial, sans-serif" font-size="17">Assets can use Typecho local upload, external image hosts, file beds, S3/R2, WebDAV, or OpenList providers.</text>
</svg>
