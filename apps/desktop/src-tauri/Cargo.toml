[package]
name = "typecho-mcp-desktop"
version = "0.1.0-alpha.1"
description = "Tauri desktop shell for Typecho MCP Workbench"
authors = ["Jason He"]
license = "UNLICENSED"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
